<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }

        .container {
            display: flex;
            width: 800px;
            height: 500px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .chat-container {
            flex: 3;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
        }

        .notepad-container {
            flex: 2;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .chat-header,
        .notepad-header {
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .message {
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .user-message {
            background: #d1e7dd;
            margin-left: auto;
        }

        .friend-message {
            background: #cfe2ff;
        }

        .input-area {
            display: flex;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            margin-left: 5px;
            padding: 8px 15px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .notepad {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #ffffd9;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <span>Chat</span>
                <span id="current-user">Your IP: <span class="user-id" id="user-ip">Loading...</span></span>
            </div>
            <div class="chat-box" id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
        <div class="notepad-container">
            <div class="notepad-header">
                <span>Notepad</span>
                <span>Auto-deletes after 1 min</span>
            </div>
            <div class="notepad" id="notepad"></div>
        </div>
    </div>

    <script>
        const simulatedIPs = [
            '172.16.9.125',
            '192.168.1.' + Math.floor(Math.random() * 255)
        ];

        let currentUserIP = simulatedIPs[0];
        document.getElementById('user-ip').textContent = currentUserIP;

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            let inputField = document.getElementById("user-input");
            let message = inputField.value.trim();
            if (message === "") return;

            addMessageToChat(message, 'user');
            addToNotepad(message, currentUserIP);

            // Send message to backend
            fetch("http://localhost:3000/save-message", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message, userIP: currentUserIP }),
            })
                .then(response => response.text())
                .then(data => console.log(data))
                .catch(error => console.error("Error:", error));

            inputField.value = "";

            if (Math.random() > 0.5) {
                setTimeout(simulateFriendResponse, 1000 + Math.random() * 2000);
            }
        }

        function addMessageToChat(text, sender) {
            let chatBox = document.getElementById("chat-box");
            let messageDiv = document.createElement("div");
            messageDiv.className = sender === 'user' ? "message user-message" : "message friend-message";
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addToNotepad(text, ip) {
            let notepad = document.getElementById("notepad");
            let entry = document.createElement("div");
            entry.className = "notepad-entry";
            entry.innerHTML = `<strong>${ip}:</strong> ${text}`;
            notepad.appendChild(entry);
            notepad.scrollTop = notepad.scrollHeight;

            setTimeout(() => entry.remove(), 60000);
        }

        function simulateFriendResponse() {
            const friendResponses = ["Hey!", "How's it going?", "Tell me more.", "Interesting!", "LOL!"];
            let randomResponse = friendResponses[Math.floor(Math.random() * friendResponses.length)];
            addMessageToChat(randomResponse, 'friend');
            addToNotepad(randomResponse, simulatedIPs[1]);
        }
    </script>
</body>

</html>
